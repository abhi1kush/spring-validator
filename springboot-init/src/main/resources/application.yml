spring:
  application:
    name: spring-validator

server:
  port: 8080

# Namespaced settings; only read because the application declares @EnableJsonRequestValidator.
spring-validator:
  # Reject JSON properties that the VO does not declare (E_UNKNOWN_FIELD). Set to false to ignore them.
  fail-on-unknown-properties: true
  # VO-specific code -> generic code (wire code like E_MANDATORY_MISSING or enum name like MANDATORY_MISSING).
  # Unmapped VO codes fall back to the default for the constraint type (e.g. @NotBlank -> E_MANDATORY_MISSING).
  error-mapping:
    USR_001: E_MANDATORY_MISSING
    USR_002: E_MAX_LENGTH_EXCEEDED
    USR_003: E_MANDATORY_MISSING
    USR_004: E_INVALID_FORMAT
    USR_005: E_INVALID_FORMAT
    USR_006: E_MIN_LENGTH_NOT_MET
    USR_007: E_INVALID_DATE
    USR_008: E_MAX_LENGTH_EXCEEDED
    ORD_001: E_MANDATORY_MISSING
    ORD_002: E_INVALID_FORMAT
    ORD_003: E_MANDATORY_MISSING
    ORD_004: E_MANDATORY_MISSING
    ORD_005: E_INVALID_FORMAT
    ORD_006: E_MANDATORY_MISSING
    ORD_007: E_INVALID_DATE
    ADR_001: E_MANDATORY_MISSING
    ADR_002: E_INVALID_FORMAT
    ADR_003: E_MANDATORY_MISSING
    ADR_004: E_MANDATORY_MISSING
